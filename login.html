<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}">
</head>

<body>

<div class="login-card">
  <h2 class="text-center fw-bold mb-2">Login</h2>
  <p class="text-center text-muted mb-4">Access your account</p>

  <form id="loginForm">
    <div class="mb-3">
      <label>Email</label>
      <input type="email" id="email" class="form-control" required>

    </div>

    <div class="mb-3">
      <label>Password</label>
      <input type="password" id="password" class="form-control" required>
    </div>

    <button type="submit" class="btn btn-dark w-100">Login</button>
  </form>

  <div class="divider">Or</div>

  <div class="row g-2">
    <div class="col-6">
      <button id="googleLogin" class="btn btn-outline-secondary w-100">
        Google
      </button>
    </div>
    <div class="col-6">
      <button id="facebookLogin" class="btn btn-outline-secondary w-100">
        Facebook
      </button>
    </div>
  </div>

  <p class="text-center mt-4 small">
    No account? <a href="{{url_for('signup')}}">Sign up</a>
  </p>
</div>

<!-- Firebase SDK (can be made to work later if i can login)-->
<script type="module" src="{{ url_for('static', filename='login.js') }}"></script>
<script src="{{ url_for('static', filename='layout.js') }}"></script>

</body>
</html>
