<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Checkout</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='cart.css') }}">
</head>
<body onload="loadLayout()" class="bg-light">
  <div class="navbar"></div>  
  <div class="container py-5">
    <h1 class="mb-4 fw-bold">Cart</h1>
  
    <div class="row g-4">
      
      <!-- Cart Items -->
      <div class="col-lg-8">
        <div class="card">
          <div class="card-header bg-light fw-semibold">
            <div class="row">
              <div class="col-6">Item</div>
              <div class="col-2 text-center">Qty</div>
              <div class="col-2 text-end">Price</div>
              <div class="col-2 text-end">Total</div>
            </div>
          </div>
  
          <div id="cart-items" class="list-group list-group-flush"></div>
        </div>
  
        <!-- Optional coupon -->
        <div class="card mt-4 p-4">
          <h5>Coupon</h5>
          <div class="d-flex gap-2">
            <input type="text" class="form-control" placeholder="Enter code" id="couponCode">
            <button class="btn btn-dark" onclick="applyCoupon()">Apply</button>
          </div>
        </div>
      </div>
  
      <!-- Order summary section -->
      <div class="col-lg-4">
        <div class="card p-4 summary-box">
          <h4 class="mb-4 fw-bold">Summary</h4>
  
          <div class="d-flex justify-content-between mb-2">
            <span>Subtotal</span>
            <span id="subtotal">£0.00</span>
          </div>
  
          <!-- Pickup / Delivery Selection -->
          <div class="d-flex justify-content-between mb-2">
            <span>Delivery Option</span>
            <div>
              <select id="deliveryOption" class="form-select">
                <option value="delivery">Delivery (£5 or free over £50)</option>
                <option value="pickup">Store Pickup (Free)</option>
              </select> 
            </div>
          </div>
  
          <div class="d-flex justify-content-between mb-2">
            <span>Delivery</span>
            <span id="shipping">£0.00</span>
          </div>
  
          <div class="d-flex justify-content-between mb-2">
            <span>Tax</span>
            <span id="tax">£0.00</span>
          </div>
  
          <hr>
  
          <div class="d-flex justify-content-between fw-bold fs-5 mb-4">
            <span>Total</span>
            <span id="total">£0.00</span>
          </div>
  
          <button class="btn btn-dark w-100 mb-2" onclick="checkout()">Checkout</button>
          <a href="/index" class="btn btn-outline-secondary w-100">Continue Shopping</a>
  
          <div class="mt-4 border-top pt-3">
            <p class="fw-semibold small mb-1">Free Delivery</p>
            <p class="text-muted small">Orders over £50</p>
  
            <p class="fw-semibold small mt-3 mb-1">Secure</p>
            <p class="text-muted small">Safe checkout</p>
          </div>
        </div>
      </div>
  
    </div>
  </div>

<script src="{{ url_for('static', filename='cart.js') }}"></script>
<script src="{{ url_for('static', filename='script.js') }}"></script>
<script src="{{ url_for('static', filename='layout.js') }}"></script>


</body>
</html>
