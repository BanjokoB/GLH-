<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='signup.css') }}">
</head>
<body>

<div class="signup-card">
  <h2 class="text-center fw-bold mb-2">Sign Up</h2>
  <p class="text-center text-muted mb-4">Create an account</p>

  <form id="signupForm" novalidate>

    <!-- First Name -->
    <div class="mb-3">
      <label class="form-label">First Name</label>
      <input type="text" id="firstName" class="form-control">
    </div>

    <!-- Last Name -->
    <div class="mb-3">
      <label class="form-label">Last Name</label>
      <input type="text" id="lastName" class="form-control">
    </div>

    <!-- Email -->
    <div class="mb-3">
      <label class="form-label">Email</label>
      <input type="email" id="email" class="form-control">
    </div>

    <!-- Password -->
    <div class="mb-3">
      <label class="form-label">Password</label>
      <div class="input-group">
        <input type="password" id="password" class="form-control">
        <button type="button" id="togglePassword" class="btn btn-outline-secondary">Show</button>
      </div>
    </div>

    <!-- Confirm Password -->
    <div class="mb-3">
      <label class="form-label">Confirm Password</label>
      <input type="password" id="confirmPassword" class="form-control">
    </div>

    <!-- Address -->
    <div class="mb-3">
      <label class="form-label">Address</label>
      <textarea id="address" class="form-control" rows="2"></textarea>
    </div>

    <!-- Loyalty -->
    <div class="mb-3 form-check">
      <input type="checkbox" id="loyalty" class="form-check-input">
      <label class="form-check-label">
        Join our Loyalty Scheme (earn points & rewards)
      </label>
    </div>

    <button type="submit" class="btn btn-dark w-100">Sign Up</button>
  </form>

  <p class="text-center mt-4 small">
    Already have an account?
    <a href="/login" class="fw-semibold text-dark">Login</a>
  </p>
</div>

<script src="{{ url_for('static', filename='signup.js') }}"></script>

</body>
</html>
