<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GLH</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<div id="cookieBanner" class="cookie-banner" aria-label="Cookie consent banner">
  <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">
    <span>
      We use cookies to improve your experience.
      By continuing, you agree to our use of cookies.
    </span>
    <div class="d-flex gap-2">
      <button class="btn btn-sm btn-outline-light" onclick="declineCookies()" aria-label="Decline cookies">Decline</button>
      <button class="btn btn-sm btn-light" onclick="acceptCookies()" aria aria-label="Accept cookies">Accept</button>
    </div>
  </div>
</div>

<body class="bg-light">

  <!-- Navbar injection -->
  <div id="navbar" aria-label="Main navbar"></div>

  <!-- HERO SECTION -->
  <section class="hero py-5" aria-label="Hero heading section">
    <div class="container py-5">
      <div class="col-md-6">
        <h1 class="display-4 fw-bold">Fresh Groceries</h1>
        <p class="lead">Quality products delivered daily</p>
        <button class="btn btn-light btn-lg bg-light text-dark" aria-label="Browse products">Browse</button>
      </div>
    </div>
  </section>

  <!-- SEARCH -->
  <div class="container search-bar" aria-label="search bar">
    <div class="bg-white p-3 rounded shadow d-flex gap-2">
      <input type="text" id="searchInput" class="form-control" placeholder="Search products..." oninput="filterProducts()">
      <button type="button" class="btn btn-primary">Search</button>
    </div>
  </div>

  <!-- Categories section -->
  <section class="container py-5" aria-label="Categories">
    <h2 class="mb-4">Categories</h2>
    <div class="row g-3" id="categories"></div>
  </section>

  <!-- Products section -->
  <section class="container py-5" aria-label="Products">
    <h2 class="mb-4">Products</h2>
    <div class="row g-4" id="products"></div>
  </section>

  <!-- Promo section -->
  <section class="container py-5" aria-label="Promo section">
    <div class="promo text-center p-5 rounded bg-white shadow">
      <h2 class="fw-bold">Join Rewards</h2>
      <p class="lead">Earn points on every purchase</p>
      <a href="/signup" class="btn btn-dark btn-lg">Sign Up</a>
    </div>
  </section>

  <!-- Search Toast Popup -->
  <div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="searchToast" class="toast align-items-center text-bg-dark border-0" role="alert">
      <div class="d-flex">
        <div class="toast-body" id="searchToastBody">
          Searching...
        </div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
      </div>
    </div>
  </div>

  <!-- Footer injection -->
  <div id="footer" aria-label="Footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{{ url_for('static', filename='layout.js') }}"></script>
  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
